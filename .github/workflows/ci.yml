name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twokey
          POSTGRES_USER: twokey
          POSTGRES_PASSWORD: twokey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twokey -d twokey"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://twokey:twokey@localhost:5432/twokey
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total;
              const row = (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + ' / ' + t[k].total + ' |';
              console.log(['## Coverage', '', '| | % | covered |', '|---|---|---|', ...['statements', 'branches', 'functions', 'lines'].map(row)].join('\n'));
            " >> "$GITHUB_STEP_SUMMARY"
          fi
