# Daily demo reset against production (docs/DEMO.md): voids demo holds through the gateway's own
# void path, clears the demo accounts' finished history, re-signs expiring demo cards and rebuilds
# the demo hook. Plan B: Render cron jobs need a paid plan, so it runs here instead
# (docs/DEPLOY.md has the one-commit switch back to the Render cron job).
#
# Repository secrets (Settings → Secrets and variables → Actions), copied from the Render
# gateway service: PROD_DATABASE_URL, PROD_RULE_HMAC_KEY, PROD_RULE_HMAC_KEY_ID,
# PROD_MERCHANT_API_CREDENTIALS. They are the gateway's own secrets; nothing else gets them.
name: Demo reset

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC = 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every PROD_* secret mapped once, to the name the script reads. MERCHANT_API_CREDENTIALS
    # also accepts an unprefixed secret of that name (it was saved that way on Nov 6).
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      RULE_HMAC_KEY: ${{ secrets.PROD_RULE_HMAC_KEY }}
      RULE_HMAC_KEY_ID: ${{ secrets.PROD_RULE_HMAC_KEY_ID }}
      MERCHANT_API_CREDENTIALS: ${{ secrets.PROD_MERCHANT_API_CREDENTIALS || secrets.MERCHANT_API_CREDENTIALS }}
    steps:
      # Names the missing secret before anything installs; never prints a value.
      - name: Check repository secrets
        run: |
          missing=0
          check() {
            if [ -z "$(printf '%s' "$2" | tr -d '[:space:]')" ]; then
              echo "::error::Repository secret $1 is missing or empty (Settings → Secrets and variables → Actions)"
              missing=1
            else
              echo "$1: set"
            fi
          }
          check PROD_DATABASE_URL "$DATABASE_URL"
          check PROD_RULE_HMAC_KEY "$RULE_HMAC_KEY"
          check PROD_RULE_HMAC_KEY_ID "$RULE_HMAC_KEY_ID"
          check PROD_MERCHANT_API_CREDENTIALS "$MERCHANT_API_CREDENTIALS"
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) [ -n "$DATABASE_URL" ] && echo "::error::PROD_DATABASE_URL is set but is not a postgres:// URL (value not printed)" && missing=1 ;;
          esac
          exit $missing
      # The code production runs: the release branch.
      - uses: actions/checkout@v4
        with:
          ref: release
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      # No --env: in GitHub Actions demo:reset reads its secrets from the environment and refuses
      # a local database.
      - run: npm run demo:reset
        env:
          NODE_ENV: production
          LOG_LEVEL: warn
          PAYPAL_ENV: sandbox
