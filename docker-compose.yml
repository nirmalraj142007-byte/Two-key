services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: twokey
      POSTGRES_USER: twokey
      POSTGRES_PASSWORD: twokey
    volumes:
      - twokey-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U twokey -d twokey']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  twokey-pgdata:
