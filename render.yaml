# Render Blueprint for Two-Key: the one public environment (production).
#
# - Every service deploys from the `release` branch. `main` no longer deploys the live site;
#   scripts/release.sh fast-forwards `release` to a checked main commit (docs/DEPLOY.md).
# - Services run on Render's Starter plan (switched in the dashboard): no sleeping, and the
#   gateway can run its migrations as a preDeployCommand. If it fails, the deploy stops and the
#   previous one stays live. Migrations are forward-only and additive (docs/DEPLOY.md).
# - No Render database: DATABASE_URL is the external Neon Postgres connection string (direct,
#   non-pooled, sslmode=require), pasted by hand into each service that needs it.
# - `npm ci --include=dev` installs the whole workspace, including tsx, even when
#   NODE_ENV=production. Services run TypeScript source through their workspace start script.
# - Secret values are never stored here (sync: false). Secret ownership is enforced by
#   `npm run check:secrets` (SECRET_OWNERS in packages/core/src/env.ts). EVAL_ENABLED,
#   EVAL_ADMIN_TOKEN and SHOW_STYLEGUIDE are local-only and must never appear here.
services:
  - type: web
    name: web
    runtime: node
    plan: starter
    branch: release
    region: oregon
    buildCommand: npm ci --include=dev && npm run build -w @twokey/web
    startCommand: npm run start -w @twokey/web
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: HUMAN_ASSERTION_PRIVATE_KEY
        sync: false
      - key: GATEWAY_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: MCP_PUBLIC_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COMPILER_PROVIDER
        sync: false
      - key: COMPILER_BASE_URL
        sync: false
      - key: COMPILER_API_KEY
        sync: false
      - key: COMPILER_MODEL
        sync: false
      - key: AGENT_MODEL
        sync: false
      - key: DAILY_BUDGET_USD_LIVE
        sync: false
      - key: NEXT_PUBLIC_AG_GRID_LICENSE_KEY
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: IP_HASH_SALT
        sync: false
      - key: HIJACK_DAILY_ATTEMPTS
        sync: false
      - key: HIJACK_DAILY_TOKENS
        sync: false
  - type: web
    name: gateway
    runtime: node
    plan: starter
    branch: release
    region: oregon
    buildCommand: npm ci --include=dev
    preDeployCommand: npm run db:migrate -w @twokey/db
    startCommand: npm run start -w @twokey/gateway
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_ENV
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: RULE_HMAC_KEY
        sync: false
      - key: RULE_HMAC_KEY_ID
        sync: false
      - key: HUMAN_ASSERTION_PUBLIC_KEY
        sync: false
      - key: AGENT_TOKEN_PEPPER
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PORT
        sync: false
      - key: MERCHANT_API_CREDENTIALS
        sync: false
      # Owner URL for migrations (preDeployCommand) once the least-privilege roles are applied.
      - key: MIGRATE_DATABASE_URL
        sync: false
      # Hold timeout for demo and hijack sessions (minutes).
      - key: DEMO_HOLD_MINUTES
        value: "15"
      # Bearer token for GET /metrics (gateway only). EVAL_ENABLED and EVAL_ADMIN_TOKEN are
      # local-only and never listed here; the gateway refuses EVAL_ENABLED in production.
      - key: METRICS_TOKEN
        sync: false
  - type: web
    name: twokey-mcp
    runtime: node
    plan: starter
    branch: release
    region: oregon
    buildCommand: npm ci --include=dev
    startCommand: npm run start -w @twokey/mcp
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GATEWAY_URL
        sync: false
      - key: TWOKEY_AGENT_TOKEN
        sync: false
      - key: PORT
        sync: false
  - type: web
    name: agent-runner
    runtime: node
    plan: starter
    branch: release
    region: oregon
    buildCommand: npm ci --include=dev
    startCommand: npm run start -w @twokey/agent-runner
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_LLM_API_KEY
        sync: false
      - key: AGENT_LLM_BASE_URL
        sync: false
      - key: AGENT_MODEL
        sync: false
      - key: AGENT_PROVIDER
        sync: false
      - key: EVAL_LLM_API_KEY
        sync: false
      - key: EVAL_LLM_BASE_URL
        sync: false
      - key: EVAL_MODELS
        sync: false
      - key: DAILY_BUDGET_USD_EVAL
        sync: false
      - key: MCP_URL
        sync: false
      - key: DAILY_BUDGET_USD_LIVE
        sync: false
      - key: HIJACK_DAILY_TOKENS
        sync: false
      - key: DEMO_EPISODE_ID
        sync: false
      - key: PORT
        sync: false
